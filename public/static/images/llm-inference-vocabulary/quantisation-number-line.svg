<text x="44" y="40" font-size="18" font-weight="600" fill="#1f2328">Quantising a weight: a fine scale rounded to a coarse one</text>
<text x="44" y="61" font-size="12.5" fill="#565b63">Schematic, not to scale: 8-bit has 256 steps (drawn as 12); 16-bit shown evenly spaced.</text>
<text x="44" y="124" font-size="12.5" font-weight="600" fill="#1f2328">16-bit</text>
<text x="44" y="216" font-size="12.5" font-weight="600" fill="#1f2328">8-bit</text>
