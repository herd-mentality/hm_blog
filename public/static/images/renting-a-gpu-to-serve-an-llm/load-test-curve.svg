<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Baseline load test against vLLM on one RTX A6000. Aggregate throughput rises from 16.6 tokens per second at concurrency 1 to 263.5 at concurrency 32. p50 time to first token stays near 530 ms up to concurrency 8, then steps up to about 1.3 seconds at 16 and 32.</title>
<rect x="0.5" y="0.5" width="719" height="409" rx="10" fill="#f8f9fa" stroke="#e3e5e9"/>
<text x="44" y="38" font-size="18" font-weight="600" fill="#1f2328">Throughput keeps climbing; latency does not stay flat</text>
<text x="44" y="59" font-size="12.5" fill="#565b63">Baseline run, straight to vLLM on one RTX A6000. Concurrency doubles at each step.</text>

<!-- plot frame -->
<rect x="92" y="70" width="536" height="240" fill="#ffffff" stroke="#e3e5e9"/>
<line x1="92" y1="130" x2="628" y2="130" stroke="#edf0f3"/>
<line x1="92" y1="190" x2="628" y2="190" stroke="#edf0f3"/>
<line x1="92" y1="250" x2="628" y2="250" stroke="#edf0f3"/>

<!-- left (throughput) ticks -->
<text x="84" y="74" font-size="10.5" text-anchor="end" fill="#274b73">280</text>
<text x="84" y="134" font-size="10.5" text-anchor="end" fill="#274b73">210</text>
<text x="84" y="194" font-size="10.5" text-anchor="end" fill="#274b73">140</text>
<text x="84" y="254" font-size="10.5" text-anchor="end" fill="#274b73">70</text>
<text x="84" y="313" font-size="10.5" text-anchor="end" fill="#274b73">0</text>
<text x="34" y="190" font-size="11" fill="#274b73" text-anchor="middle" transform="rotate(-90 34 190)">throughput (tok/s)</text>

<!-- right (TTFT) ticks -->
<text x="636" y="74" font-size="10.5" text-anchor="start" fill="#7a3c10">1400</text>
<text x="636" y="134" font-size="10.5" text-anchor="start" fill="#7a3c10">1050</text>
<text x="636" y="194" font-size="10.5" text-anchor="start" fill="#7a3c10">700</text>
<text x="636" y="254" font-size="10.5" text-anchor="start" fill="#7a3c10">350</text>
<text x="636" y="313" font-size="10.5" text-anchor="start" fill="#7a3c10">0</text>
<text x="690" y="190" font-size="11" fill="#7a3c10" text-anchor="middle" transform="rotate(90 690 190)">p50 TTFT (ms)</text>

<!-- x axis -->
<text x="92" y="328" font-size="10.5" text-anchor="middle" fill="#565b63">1</text>
<text x="199.2" y="328" font-size="10.5" text-anchor="middle" fill="#565b63">2</text>
<text x="306.4" y="328" font-size="10.5" text-anchor="middle" fill="#565b63">4</text>
<text x="413.6" y="328" font-size="10.5" text-anchor="middle" fill="#565b63">8</text>
<text x="520.8" y="328" font-size="10.5" text-anchor="middle" fill="#565b63">16</text>
<text x="628" y="328" font-size="10.5" text-anchor="middle" fill="#565b63">32</text>
<text x="360" y="350" font-size="11.5" text-anchor="middle" fill="#1f2328">concurrent requests</text>

<!-- knee marker at concurrency 8 -->
<line x1="413.6" y1="70" x2="413.6" y2="310" stroke="#8b9199" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<text x="407" y="84" font-size="10.5" text-anchor="end" fill="#565b63">knee at 8</text>

<!-- throughput series (left axis) -->
<polyline points="92,295.8 199.2,282.7 306.4,257.9 413.6,218.5 520.8,157.4 628,84.1" fill="none" stroke="#4a7fc0" stroke-width="2"/>
<circle cx="92" cy="295.8" r="3.5" fill="#4a7fc0"/>
<circle cx="199.2" cy="282.7" r="3.5" fill="#4a7fc0"/>
<circle cx="306.4" cy="257.9" r="3.5" fill="#4a7fc0"/>
<circle cx="413.6" cy="218.5" r="3.5" fill="#4a7fc0"/>
<circle cx="520.8" cy="157.4" r="3.5" fill="#4a7fc0"/>
<circle cx="628" cy="84.1" r="3.5" fill="#4a7fc0"/>
<text x="620" y="100" font-size="10.5" text-anchor="end" font-weight="600" fill="#274b73">263.5</text>

<!-- TTFT series (right axis) -->
<polyline points="92,203.5 199.2,217.9 306.4,219.8 413.6,216.7 520.8,85.3 628,89.4" fill="none" stroke="#d9803a" stroke-width="2"/>
<circle cx="92" cy="203.5" r="3.5" fill="#d9803a"/>
<circle cx="199.2" cy="217.9" r="3.5" fill="#d9803a"/>
<circle cx="306.4" cy="219.8" r="3.5" fill="#d9803a"/>
<circle cx="413.6" cy="216.7" r="3.5" fill="#d9803a"/>
<circle cx="520.8" cy="85.3" r="3.5" fill="#d9803a"/>
<circle cx="628" cy="89.4" r="3.5" fill="#d9803a"/>
<text x="512" y="78" font-size="10.5" text-anchor="end" font-weight="600" fill="#7a3c10">~1.3 s</text>
<text x="300" y="238" font-size="10.5" text-anchor="middle" fill="#7a3c10">~530 ms</text>

<!-- legend -->
<line x1="150" y1="372" x2="170" y2="372" stroke="#4a7fc0" stroke-width="2"/>
<circle cx="160" cy="372" r="3.5" fill="#4a7fc0"/>
<text x="178" y="376" font-size="11.5" fill="#1f2328">aggregate throughput</text>
<line x1="360" y1="372" x2="380" y2="372" stroke="#d9803a" stroke-width="2"/>
<circle cx="370" cy="372" r="3.5" fill="#d9803a"/>
<text x="388" y="376" font-size="11.5" fill="#1f2328">p50 time to first token</text>
<text x="360" y="398" font-size="11" text-anchor="middle" fill="#565b63">Past concurrency 8, extra load still buys throughput but pays for it in first-token latency.</text>
</svg>
